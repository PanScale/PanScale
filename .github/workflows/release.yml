name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # changesets/action pushes the changeset-release/main branch and tags
  pull-requests: write  # ... and opens the Version Packages PR
  id-token: write       # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install
      # changesets publishes the package folders as they are: 0.3.1 went out without dist/.
      - run: pnpm turbo build --filter="./packages/*"
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
